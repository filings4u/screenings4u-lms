      <div id="appointmentsMessage" class="appointments-message" hidden aria-live="polite"></div>

      <section class="appointments-card">
        <div class="appointments-card-head">
          <div><h2>Training Sessions</h2><p>Every live appointment is hosted through Microsoft Teams inside Screenings4u.</p></div>

        <div id="appointmentsList" class="appointments-list"><div class="appointments-loading"><span class="appointments-spinner"></span><p>Loading your appointments…</p></div></div>
