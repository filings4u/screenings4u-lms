<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="theme-color" content="#325aa3" />


  <title>
    Learning Home | screenings4u Learning Center
  </title>
  <link rel="icon" type="image/png" href="images/fav.png">


  <link
    rel="stylesheet"
    href="assets/css/lms.css"
  >

</head>


<body>


  <!-- ========================================================
       APPLICATION
       ======================================================== -->

  <div class="lms-app">


 <!-- Dynamic LMS Sidebar Target -->
<div id="lms-sidebar-target"></div>

    <!-- ======================================================
         MAIN
         ====================================================== -->

    <main class="lms-main">


      <!-- ====================================================
           TOP BAR
           ==================================================== -->

      <header class="lms-topbar">


        <!-- LEFT -->

        <div class="lms-topbar-left">

          <button
            type="button"
            class="lms-menu-button"
            data-lms-menu-toggle
            aria-label="Toggle navigation"
          >

            <svg viewBox="0 0 24 24">

              <path d="M4 7h16" />

              <path d="M4 12h16" />

              <path d="M4 17h16" />

            </svg>

          </button>

        </div>


        <!-- SEARCH -->

        <div class="lms-search-wrap">

          <label class="lms-search">

            <span class="lms-search-icon">

              <svg viewBox="0 0 24 24">

                <circle
                  cx="11"
                  cy="11"
                  r="6"
                />

                <path d="m20 20-4-4" />

              </svg>

            </span>


            <input
              type="search"
              placeholder="Search courses, lessons, and resources..."
              data-lms-search
            >


            <span class="lms-search-shortcut">
              Ctrl K
            </span>

          </label>

        </div>


        <!-- RIGHT -->

        <div class="lms-topbar-right">


          <!-- NOTIFICATIONS -->

          <button
            type="button"
            class="lms-icon-button"
            aria-label="Notifications"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
              />

              <path d="M10 21h4" />

            </svg>


            <span class="lms-notification-dot"></span>

          </button>


          <!-- USER -->

          <div class="lms-user-wrap">


            <button
              type="button"
              class="lms-user-button"
              data-lms-user-button
              aria-expanded="false"
            >

              <span
                class="lms-user-avatar"
                data-lms-learner-initials
              >
                JD
              </span>


              <span
                class="lms-user-name"
                data-lms-learner-name
              >
                Learner
              </span>


              <span class="lms-user-chevron">

                <svg viewBox="0 0 24 24">

                  <path d="m7 10 5 5 5-5" />

                </svg>

              </span>

            </button>


            <!-- USER DROPDOWN -->

            <div
              class="lms-user-menu"
              data-lms-user-menu
            >


              <div class="lms-user-menu-header">

                <span
                  class="lms-user-menu-name"
                  data-lms-user-menu-name
                >
                  Learner
                </span>


                <span
                  class="lms-user-menu-email"
                  data-lms-user-menu-email
                >
                  
                </span>

              </div>


              <a
                href="lms-account.html"
                class="lms-user-menu-link"
              >
                My Account
              </a>


              <a
                href="lms-certificates.html"
                class="lms-user-menu-link"
              >
                My Certificates
              </a>


              <button
                type="button"
                class="lms-user-menu-link"
                data-lms-sign-out
              >
                Sign Out
              </button>


            </div>

          </div>


        </div>


      </header>



    </main>


  </div>


  <!-- ========================================================
       JAVASCRIPT
       ======================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/core-auth.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/portal-auth-guard.js"></script>
<script src="assets/js/training-auth-guard.js"></script>
<script src="assets/js/lms-sidebar.js"></script>
<script src="assets/js/lms.js?v=20260830-2000"></script>
<script src="assets/js/lms-dashboard.js?v=20260830-2000"></script>

</body>

</html>
