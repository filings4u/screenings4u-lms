<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#325aa3" />

  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=training-login.html">
  <title>Opening Training Login | screenings4u</title>
  <link rel="icon" type="image/png" href="images/fav.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #ff6b00;
      --blue: #325aa3;
      --blue-deep: #17335f;
      --blue-darker: #10284b;
      --blue-pale: #f4f7fc;
      --muted: #667892;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", Arial, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 18% 20%, rgba(50, 90, 163, 0.42), transparent 30%),
        radial-gradient(circle at 82% 80%, rgba(255, 107, 0, 0.18), transparent 28%),
        linear-gradient(135deg, var(--blue-darker), var(--blue-deep));
    }

    .redirect-card {
      width: min(100%, 480px);
      padding: 42px 34px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 22px 60px rgba(7, 26, 49, 0.28);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      margin-bottom: 28px;
      padding: 9px 14px;
      border-radius: 10px;
      background: var(--white);
    }

    .brand img {
      display: block;
      width: 145px;
      max-height: 42px;
      object-fit: contain;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255, 255, 255, 0.22);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      letter-spacing: -0.035em;
    }

    p {
      margin: 0;
      color: #d7e3f1;
      font-size: 13px;
      line-height: 1.7;
    }

    a { color: #ffb47d; font-weight: 800; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .loader { animation: none; }
    }
  </style>
  <script>
    window.location.replace("training-login.html");
  </script>
</head>
<body>
  <main class="redirect-card">
    <a class="brand" href="https://screenings4u.com" aria-label="screenings4u home">
      <img src="images/logo.png" alt="screenings4u">
    </a>
    <div class="loader" aria-hidden="true"></div>
    <h1>Opening the Training Center</h1>
    <p>If you are not redirected automatically, <a href="training-login.html">continue to the training login</a>.</p>
  </main>
</body>
</html>
